<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  /* 1. Reset everything to zero friction */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    background: #f5f5f5; 
    padding: 20px 10px;
    display: flex;
    justify-content: center;
    font-family: sans-serif;
  }

  /* 2. The Vault - Forced White */
  .snn-container {
    width: 350px;
    height: 630px;
    background: #ffffff;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .tab-bar {
    display: flex;
    background: #ffffff;
    border-bottom: 1px solid #eee;
  }

  .tab-button {
    flex: 1;
    padding: 15px 5px;
    border: none;
    background: none;
    font-size: 11px;
    font-weight: bold;
    color: #999;
    text-transform: uppercase;
    cursor: pointer;
  }

  .tab-button.active {
    color: #000;
    border-bottom: 2px solid #000;
  }

  /* 3. The Content Area */
  .content-area {
    flex: 1;
    background: #ffffff;
    overflow: hidden;
  }

  .tab-panel {
    display: none;
    height: 100%;
    width: 100%;
  }

  .tab-panel.active {
    display: block;
  }

  /* 4. NEW: The Hero Tab (Centering + Background) */
.hero-tab {
    height: 100%;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    /* UPDATE THE URL BELOW */
    background-image: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), 
                      url('https://github.com/sam-a-sys/test-for-embed/v2/assets/Screenshot%202025-11-23%20113322.png');
    background-size: cover;
    background-position: center;
  }

  /* 5. The Iframe */
  iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
  }
</style>
</head>
<body>

<div class="snn-container">
  <div class="tab-bar">
    <button class="tab-button active" data-tab="f">Form</button>
    <button class="tab-button" data-tab="v">Vault</button>
    <button class="tab-button" data-tab="a">Archive</button>
    <button class="tab-button" data-tab="p">Protocol</button>
  </div>
  
  <div class="content-area">
    <div class="tab-panel active" id="f">
      <div class="hero-tab">
        <div data-fillout-id="8dhGMjUv7Rus" data-fillout-embed-type="popup" data-fillout-dynamic-resize data-fillout-inherit-parameters data-fillout-popup-size="medium"></div>
        <script src="https://server.fillout.com/embed/v1/"></script>
      </div>
    </div>

    <div class="tab-panel" id="v">
      <iframe src="https://docs.google.com/spreadsheets/d/e/2PACX-1vTuKRlZV-7OyUpi4jvECqyOgwEhOFs7OpBXCq9zY3s7o52k3WBp9G25xP_DjtLWOpdXForpozskU9a1/pubhtml?widget=false&headers=false"></iframe>
    </div>
    
    <div class="tab-panel" id="a"><div style="padding:20px; color:#ccc;">Archive Locked</div></div>
    <div class="tab-panel" id="p"><div style="padding:20px; color:#ccc;">SNN Protocol</div></div>
  </div>
</div>

<script>
  const btns = document.querySelectorAll('.tab-button');
  const panels = document.querySelectorAll('.tab-panel');
  btns.forEach(b => {
    b.onclick = () => {
      btns.forEach(x => x.classList.remove('active'));
      panels.forEach(p => p.classList.remove('active'));
      b.classList.add('active');
      document.getElementById(b.dataset.tab).classList.add('active');
    }
  });
</script>
</body>
</html>
