<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  /* 1. Reset everything to zero friction */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    background: #f5f5f5; 
    padding: 20px 10px;
    display: flex;
    justify-content: center;
    font-family: sans-serif;
  }

  /* 2. The Vault - Forced White */
  .snn-container {
    width: 350px;
    height: 630px;
    background: #ffffff;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Black Title Bar */
  .widget-header {
    background: #000; 
    color: #fff; 
    padding: 12px; 
    font-size: 11px; 
    font-weight: bold; 
    text-transform: uppercase; 
    letter-spacing: 1px; 
    text-align: center;
  }

  .tab-bar {
    display: flex;
    background: #ffffff;
    border-bottom: 1px solid #eee;
  }

  .tab-button {
    flex: 1;
    padding: 12px 2px;
    border: none;
    background: none;
    font-size: 10px;
    font-weight: bold;
    color: #999;
    text-transform: uppercase;
    cursor: pointer;
  }

  .tab-button.active {
    color: #000;
    border-bottom: 2px solid #000;
  }

  /* 3. The Content Area */
  .content-area {
    flex: 1;
    background: #ffffff;
    overflow: hidden;
  }

  .tab-panel {
    display: none;
    height: 100%;
    width: 100%;
  }

  .tab-panel.active {
    display: block;
  }

  /* 4. The Hero Tab (Centering + Background) */
  .hero-tab {
    height: 100%;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    background-image: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), 
                      url('https://raw.githubusercontent.com/sam-a-sys/test-for-embed/main/v2/assets/japanese_pastel_green_bg.png');
    background-size: cover;
    background-position: center;
  }

  iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
  }
</style>
</head>
<body>

<div class="snn-container">
  <div class="widget-header">
    Economic And Financial News
  </div>

  <div class="tab-bar">
    <button class="tab-button active" data-tab="f">1.WF Choice</button>
    <button class="tab-button" data-tab="v">2.WF Trigger</button>
    <button class="tab-button" data-tab="a">Output Data</button>
    <button class="tab-button" data-tab="p">WF Run Log</button>
  </div>
  
  <div class="content-area">
    <div class="tab-panel active" id="f">
      <div class="hero-tab">
     
<div data-fillout-id="8dhGMjUv7Rus" data-fillout-embed-type="popup" data-fillout-button-text="Financial News - Choose WF" data-fillout-dynamic-resize data-fillout-button-color="#C89B1E" data-fillout-button-size="medium" data-fillout-inherit-parameters data-fillout-popup-size="medium"></div><script src="https://server.fillout.com/embed/v1/"></script>

      </div>
    </div>

    <div class="tab-panel" id="v" style="color:red; zoom:0.8;">
       <div class="hero-tab">
 
   <iframe src="https://www.stack-ai.com/ai-webpage/6987442aaaa2687e8b366666-1iqLYZOg5sjq9A7DlaXhEC"></iframe>
      </div>
    </div>
    
    <div class="tab-panel" id="a">
      <div style="padding:40px; text-align:center; color:#bbb; font-size: 13px;">
        <p>Awaiting Stack-AI Processing...</p>
        <div style="margin-top: 20px; border: 1px dashed #ccc; height: 100px;"></div>
      </div>
    </div>

    <div class="tab-panel" id="p">
      <iframe src="https://docs.google.com/spreadsheets/d/e/2PACX-1vTuKRlZV-7OyUpi4jvECqyOgwEhOFs7OpBXCq9zY3s7o52k3WBp9G25xP_DjtLWOpdXForpozskU9a1/pubhtml?widget=false&headers=false"></iframe>
    </div>
  </div>
</div>

<script>
  const btns = document.querySelectorAll('.tab-button');
  const panels = document.querySelectorAll('.tab-panel');
  btns.forEach(b => {
    b.onclick = () => {
      btns.forEach(x => x.classList.remove('active'));
      panels.forEach(p => p.classList.remove('active'));
      b.classList.add('active');
      document.getElementById(b.dataset.tab).classList.add('active');
    }
  });
</script>
</body>
</html>
